[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-analysis-reviews"
version = "0.2.0"
description = "An end-to-end review sentiment analysis lab with URL-driven scraping, Persian NLP, classical machine learning, model evaluation, and an interactive Next.js playground."
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
sentiment-project = "app.main:main"

[tool.setuptools]
packages = ["app", "src", "src.sentiment_analysis", "src.sentiment_analysis.scraping", "src.sentiment_analysis.preprocessing"]
